<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock, Paper, Scissors</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .game-container {
      background-color: #1e1e1e;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      text-align: center;
      width: 340px;
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    .scoreboard {
      display: flex;
      justify-content: space-around;
      background-color: #2c2c2c;
      padding: 1rem;
      border-radius: 10px;
      margin: 1.5rem 0;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .choices {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    button {
      flex: 1;
      padding: 1rem 0.5rem;
      font-size: 2rem;
      background-color: #333;
      border: 2px solid #444;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }

    button:hover {
      background-color: #444;
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.95);
    }

    #result {
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 1.5em;
      margin-bottom: 0.5rem;
    }

    #details {
      color: #aaa;
      font-size: 0.95rem;
      min-height: 1.2em;
      margin-bottom: 1.5rem;
    }

    .reset-btn {
      font-size: 0.9rem;
      padding: 0.6rem 1.2rem;
      background-color: #d9534f;
      border: none;
      width: 100%;
    }

    .reset-btn:hover {
      background-color: #c9302c;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>Rock, Paper, Scissors</h1>
    
    <div class="scoreboard">
      <div>You: <span id="player-score">0</span></div>
      <div>CPU: <span id="cpu-score">0</span></div>
    </div>

    <div class="choices">
      <button onclick="play('rock')" title="Rock">✊</button>
      <button onclick="play('paper')" title="Paper">✋</button>
      <button onclick="play('scissors')" title="Scissors">✌️</button>
    </div>

    <div id="result">Choose your move!</div>
    <div id="details"></div>

    <button class="reset-btn" onclick="resetGame()">Reset Score</button>
  </div>

  <script>
    let playerScore = 0;
    let cpuScore = 0;

    const emojis = {
      rock: '✊',
      paper: '✋',
      scissors: '✌️'
    };

    function play(playerChoice) {
      const options = ['rock', 'paper', 'scissors'];
      const cpuChoice = options[Math.floor(Math.random() * 3)];

      const resultEl = document.getElementById('result');
      const detailsEl = document.getElementById('details');

      detailsEl.textContent = `You chose ${emojis[playerChoice]} vs CPU ${emojis[cpuChoice]}`;

      if (playerChoice === cpuChoice) {
        resultEl.textContent = "It's a tie!";
        resultEl.style.color = '#f0ad4e';
      } else if (
        (playerChoice === 'rock' && cpuChoice === 'scissors') ||
        (playerChoice === 'paper' && cpuChoice === 'rock') ||
        (playerChoice === 'scissors' && cpuChoice === 'paper')
      ) {
        playerScore++;
        resultEl.textContent = "You win!";
        resultEl.style.color = '#5cb85c';
      } else {
        cpuScore++;
        resultEl.textContent = "CPU wins!";
        resultEl.style.color = '#d9534f';
      }

      document.getElementById('player-score').textContent = playerScore;
      document.getElementById('cpu-score').textContent = cpuScore;
    }

    function resetGame() {
      playerScore = 0;
      cpuScore = 0;
      document.getElementById('player-score').textContent = 0;
      document.getElementById('cpu-score').textContent = 0;
      document.getElementById('result').textContent = "Choose your move!";
      document.getElementById('result').style.color = '#ffffff';
      document.getElementById('details').textContent = "";
    }
  </script>

</body>
</html>
